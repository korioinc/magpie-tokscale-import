name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate release version
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { VERSION } from "./lib/config.mjs";
          const tag = process.env.GITHUB_REF_NAME;
          assert.match(tag, /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/, "Use a stable version tag such as v1.0.1.");
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          assert.equal(tag, `v${pkg.version}`, "Tag must match package.json version.");
          assert.equal(lock.version, pkg.version, "Update package-lock.json version.");
          assert.equal(lock.packages[""].version, pkg.version, "Update the lockfile root package version.");
          assert.equal(VERSION, `magpie-import/${pkg.version}`, "Update VERSION in lib/config.mjs.");
          assert.ok(VERSION.length <= 20, "Tokscale requires the importer version to fit in 20 characters.");
          NODE

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check

      - name: Package release
        run: |
          mkdir dist
          npm pack --ignore-scripts --pack-destination dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" = "false" ]; then
              echo "Release $TAG is already published; nothing to do."
              exit 0
            fi
          else
            gh release create "$TAG" \
              --verify-tag --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.tgz --clobber
          gh release edit "$TAG" --draft=false
